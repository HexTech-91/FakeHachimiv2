plugins {
    id "fabric-loom" version "1.17.20"
}

version = "2.0"
group = "net.hachimi"

base {
    archivesName = "Hachimi"
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.1"
    mappings "net.fabricmc:yarn:1.21.1+build.3:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.14"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.116.12+1.21.1"

    modImplementation("io.github.llamalad7:mixinextras-fabric:0.4.1")
    include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:0.4.1")))

    compileOnly "org.apache.httpcomponents:httpclient:4.5.14"
    compileOnly "org.apache.httpcomponents:httpcore:4.4.16"
    compileOnly "org.apache.commons:commons-lang3:3.14.0"
    compileOnly "commons-io:commons-io:2.16.1"
}

loom {
    accessWidenerPath = file("src/main/resources/hachimi.accesswidener")
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs << "-nowarn"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
